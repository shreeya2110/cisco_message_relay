spring:
  application:
    name: java-message-relay
  lifecycle:
    timeout-per-shutdown-phase: 10s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      enabled: false

server:
  address: 127.0.0.1
  port: 8090
  shutdown: graceful
  max-http-request-header-size: 8KB
  tomcat:
    max-connections: 128
    accept-count: 32
    threads:
      max: 32
      min-spare: 4
    connection-timeout: 5s
    keep-alive-timeout: 5s
    max-keep-alive-requests: 100
    max-swallow-size: 16KB

relay:
  max-clients: 100
  mailbox-capacity: 100
  max-message-bytes: 4096
  max-request-bytes: 16384
 
